# Build the doom_share package and play it with an engine from the catalog,
# on both CPU architectures. The arm64 job is the Raspberry Pi's aarch64-linux.
name: smoke-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Flox
        run: |
          curl -fsSL https://get.flox.dev | sh
          flox --version
          flox config --set disable_metrics true

      - name: Build doom_share and play it
        run: ./ci/smoke-test

  # Both packages build on each system the manifest declares. macos-14 is
  # aarch64-darwin; the two Linux runners cover x86_64-linux and aarch64-linux.
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # flox publish records `git rev-list --count` as build provenance,
          # and a shallow clone publishes the wrong number without failing.
          fetch-depth: 0

      - name: Install Flox
        run: |
          curl -fsSL https://get.flox.dev | sh
          flox --version
          flox config --set disable_metrics true

      - name: Build both packages
        run: flox build doom_share doom

      # Publishing to the flox-labs catalog. Each system publishes its own
      # build of the same version; they land as one catalog entry. Needs
      # FLOX_FLOXHUB_TOKEN in the repository secrets, and a branch rather
      # than a tag: publish refuses a detached HEAD.
      #
      # - name: Publish
      #   if: github.ref == 'refs/heads/main'
      #   env:
      #     FLOX_FLOXHUB_TOKEN: ${{ secrets.FLOX_FLOXHUB_TOKEN }}
      #   run: flox publish -o flox-labs doom
