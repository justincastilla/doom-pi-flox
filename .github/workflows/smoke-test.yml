# Build the doom_share package and play it with an engine from the catalog,
# on both CPU architectures. The arm64 job is the Raspberry Pi's aarch64-linux.
name: smoke-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Flox
        run: |
          curl -fsSL https://get.flox.dev | sh
          flox --version
          flox config --set disable_metrics true

      - name: Build doom_share and play it
        run: ./ci/smoke-test
