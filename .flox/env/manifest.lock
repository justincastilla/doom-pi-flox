    "build": {
      "doom_share": {
        "command": "  set -euo pipefail\n  mkdir -p \"$out/bin\" \"$out/share/games/doom\" \"$out/share/doc/doom_share\"\n  cp wads/doom1.wad \"$out/share/games/doom/doom1.wad\"\n  cp bin/doom_share \"$out/bin/doom\"\n  chmod 0755 \"$out/bin/doom\"\n  ln -s doom \"$out/bin/doom_share\"\n  cp LICENSE README.md \"$out/share/doc/doom_share/\"\n  # Belt and braces: refuse to package anything but the v1.9 shareware WAD.\n  echo \"f0cefca49926d00903cf57551d901abe  $out/share/games/doom/doom1.wad\" | md5sum -c -\n",
        "runtime-packages": [
          "crispy-doom"
        ],
        "sandbox": "pure",
        "version": "1.9",
        "description": "DOOM shareware v1.9 by id Software (Episode 1: Knee-Deep in the Dead) plus a launcher for any Doom engine"
      }
    }
  },
