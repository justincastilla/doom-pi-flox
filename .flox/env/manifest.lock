{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.16.0",
    "install": {
      "crispy-doom": {
        "pkg-path": "crispy-doom"
      }
    },
    "vars": {
      "DOOM_IWAD": "doom1.wad",
      "DOOM_PORT": "crispy-doom"
    },
    "hook": {
      "on-activate": "  # Put the launcher scripts on PATH so `flox activate -- doom` just works.\n  export PATH=\"$FLOX_ENV_PROJECT/bin:$PATH\"\n\n  # Where the engine looks for IWADs by name (-iwad doom1.wad):\n  #   ./wads  -> shareware doom1.wad (committed); your own DOOM.WAD / DOOM2.WAD go here too\n  export DOOMWADPATH=\"$FLOX_ENV_PROJECT/wads${DOOMWADPATH:+:$DOOMWADPATH}\"\n"
    },
    "profile": {
      "common": "  # Only chatter in an interactive shell, never under `flox activate -- cmd`.\n  case \"$-\" in *i*)\n    echo \"DOOM environment active: run 'doom', 'doom-kiosk' (booth loop) or 'smoke-test'.\"\n    ;;\n  esac\n"
    },
    "options": {
      "systems": [
        "aarch64-linux",
        "x86_64-linux",
        "aarch64-darwin",
        "x86_64-darwin"
      ]
    }
  },
