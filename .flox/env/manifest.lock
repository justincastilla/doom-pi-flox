  "manifest": {
    "schema-version": "1.16.0",
    "install": {
      "coreutils": {
        "pkg-path": "coreutils"
      },
      "crispy-doom": {
        "pkg-path": "crispy-doom"
      },
      "curl": {
        "pkg-path": "curl"
      },
      "gnused": {
        "pkg-path": "gnused"
      },
      "unzip": {
        "pkg-path": "unzip"
      }
    },
    "options": {
      "systems": [
        "aarch64-linux",
        "x86_64-linux",
        "aarch64-darwin"
      ]
    },
    "build": {
      "doom": {
        "command": "  set -euo pipefail\n  # ${doom_share} is that build's $out: the WAD and the docs are assembled\n  # once. Only share/ is taken; bin/ there is that package's own wrapped\n  # launcher. Store paths come back read-only.\n  mkdir -p \"$out/bin\" \"$out/share\"\n  cp -r ${doom_share}/share/. \"$out/share/\"\n  chmod -R u+w \"$out/share\"\n  mv \"$out/share/doc/doom_share\" \"$out/share/doc/doom\"\n  cp bin/doom \"$out/bin/doom\"\n  chmod 0755 \"$out/bin/doom\"\n",
        "runtime-packages": [
          "crispy-doom"
        ],
        "sandbox": "pure",
        "version": "1.9",
        "description": "DOOM shareware v1.9 by id Software (Episode 1: Knee-Deep in the Dead), ready to play with Crispy Doom"
      },
      "doom_share": {
        "command": "  set -euo pipefail\n  mkdir -p \"$out/bin\" \"$out/share/games/doom\" \"$out/share/doc/doom_share\"\n  cp ${wad}/share/games/doom/doom1.wad \"$out/share/games/doom/doom1.wad\"\n  chmod 0644 \"$out/share/games/doom/doom1.wad\"\n  cp bin/doom_share \"$out/bin/doom_share\"\n  chmod 0755 \"$out/bin/doom_share\"\n  cp LICENSE README.md \"$out/share/doc/doom_share/\"\n  # Belt and braces: refuse to package anything but the v1.9 shareware WAD.\n  echo \"f0cefca49926d00903cf57551d901abe  $out/share/games/doom/doom1.wad\" | md5sum -c -\n",
        "runtime-packages": [],
        "sandbox": "pure",
        "version": "1.9",
        "description": "DOOM shareware v1.9 by id Software (Episode 1: Knee-Deep in the Dead) plus a launcher for any Doom engine"
      },
      "wad": {
        "command": "  # An unsandboxed build runs in the project directory; unpack somewhere else\n  # so nothing lands in the working tree.\n  cd \"$(mktemp -d)\"\n  curl -fsSL -o doom19s.zip https://www.gamers.org/pub/idgames/idstuff/doom/doom19s.zip\n  # doom19s.zip is id's DEICE installer for DOS. DOOMS_19.1 and DOOMS_19.2\n  # are the two disks of one split zip, the first carrying a self-extractor\n  # stub, so they concatenate into an archive unzip can read.\n  unzip -q doom19s.zip DOOMS_19.1 DOOMS_19.2\n  cat DOOMS_19.1 DOOMS_19.2 > doom19s.bin\n  mkdir -p $out/share/games/doom\n  unzip -q -j doom19s.bin DOOM1.WAD -d $out/share/games/doom\n  mv $out/share/games/doom/DOOM1.WAD $out/share/games/doom/doom1.wad\n",
        "sandbox": "off",
        "version": "1.9",
        "description": "id Software's shareware DOOM v1.9 IWAD, unpacked from the original 1995 installer"
      }
    }
  },
