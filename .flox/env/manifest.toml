schema-version = "1.16.0"

## doom, doom_share: id Software's 1993 shareware DOOM as Flox packages ---
##
##   flox build                # -> result-wad, result-doom_share, result-doom
##   flox publish doom         # -> <your-catalog>/doom on FloxHub
##
## doom carries an engine and plays on its own:
##   flox run -p <catalog>/doom -- doom
##
## doom_share is the game data; pair it with any engine from the catalog:
##   flox install <engine> <catalog>/doom_share
##   doom_share
##
## [build.wad] vendors the IWAD; the two pure builds take it via ${wad}.
##
## This block sits below schema-version because `flox edit` drops anything
## above it.
##
## Manifest reference: https://flox.dev/docs/reference/command-reference/manifest.toml/
## ----------------------------------------------------------------------

## Build-time tools, except crispy-doom, which is a runtime dependency of
## [build.doom] (see runtime-packages below). [build.doom_share] keeps
## runtime-packages empty; there the engine is the consumer's choice.
[install]
coreutils.pkg-path = "coreutils"
gnused.pkg-path = "gnused"
curl.pkg-path = "curl"
unzip.pkg-path = "unzip"
crispy-doom.pkg-path = "crispy-doom"

# Vendoring stage: fetches the IWAD so the builds that package it can stay
# pure.
[build.wad]
description = "id Software's shareware DOOM v1.9 IWAD, unpacked from the original 1995 installer"
version = "1.9"
# The default value, spelled out: this is the stage with network access.
sandbox = "off"
command = '''
  # An unsandboxed build runs in the project directory; unpack somewhere else
  # so nothing lands in the working tree.
  cd "$(mktemp -d)"
  curl -fsSL -o doom19s.zip https://www.gamers.org/pub/idgames/idstuff/doom/doom19s.zip
  # doom19s.zip is id's DEICE installer for DOS. DOOMS_19.1 and DOOMS_19.2
  # are the two disks of one split zip, the first carrying a self-extractor
  # stub, so they concatenate into an archive unzip can read.
  unzip -q doom19s.zip DOOMS_19.1 DOOMS_19.2
  cat DOOMS_19.1 DOOMS_19.2 > doom19s.bin
  mkdir -p $out/share/games/doom
  unzip -q -j doom19s.bin DOOM1.WAD -d $out/share/games/doom
  mv $out/share/games/doom/DOOM1.WAD $out/share/games/doom/doom1.wad
'''

[build.doom_share]
description = "DOOM shareware v1.9 by id Software (Episode 1: Knee-Deep in the Dead) plus a launcher for any Doom engine"
version = "1.9"
# Pure: git-tracked files and ${wad}, nothing else.
sandbox = "pure"
# The package is data plus a shell script; it needs no packages at runtime.
runtime-packages = []
command = '''
  set -euo pipefail
  mkdir -p "$out/bin" "$out/share/games/doom" "$out/share/doc/doom_share"
  cp ${wad}/share/games/doom/doom1.wad "$out/share/games/doom/doom1.wad"
  chmod 0644 "$out/share/games/doom/doom1.wad"
  cp bin/doom_share "$out/bin/doom_share"
  chmod 0755 "$out/bin/doom_share"
  cp LICENSE README.md "$out/share/doc/doom_share/"
  # Belt and braces: refuse to package anything but the v1.9 shareware WAD.
  echo "f0cefca49926d00903cf57551d901abe  $out/share/games/doom/doom1.wad" | md5sum -c -
'''

[build.doom]
description = "DOOM shareware v1.9 by id Software (Episode 1: Knee-Deep in the Dead), ready to play with Crispy Doom"
version = "1.9"
sandbox = "pure"
# The engine travels with the package; Flox puts it on PATH for $out/bin.
runtime-packages = ["crispy-doom"]
command = '''
  set -euo pipefail
  # ${doom_share} is that build's $out: the WAD and the docs are assembled
  # once. Only share/ is taken; bin/ there is that package's own wrapped
  # launcher. Store paths come back read-only.
  mkdir -p "$out/bin" "$out/share"
  cp -r ${doom_share}/share/. "$out/share/"
  chmod -R u+w "$out/share"
  mv "$out/share/doc/doom_share" "$out/share/doc/doom"
  cp bin/doom "$out/bin/doom"
  chmod 0755 "$out/bin/doom"
'''

[options]
systems = ["aarch64-linux", "x86_64-linux", "aarch64-darwin"]
