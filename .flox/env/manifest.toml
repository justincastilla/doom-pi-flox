schema-version = "1.16.0"

## Build-time tools only. Nothing here is a runtime dependency of the
## package (see runtime-packages below); the engine is the consumer's choice.
[install]
coreutils.pkg-path = "coreutils"
gnused.pkg-path = "gnused"

[build.doom_share]
description = "DOOM shareware v1.9 by id Software (Episode 1: Knee-Deep in the Dead) plus a launcher for any Doom engine"
version = "1.9"
# Pure: built from git-tracked files only, no network. This is what makes
# `flox publish` reproducible: the WAD in the package is the WAD in git.
sandbox = "pure"
# The package is data plus a shell script; it needs no packages at runtime.
runtime-packages = []
command = '''
  set -euo pipefail
  mkdir -p "$out/bin" "$out/share/games/doom" "$out/share/doc/doom_share"
  cp wads/doom1.wad "$out/share/games/doom/doom1.wad"
  cp bin/doom_share "$out/bin/doom_share"
  chmod 0755 "$out/bin/doom_share"
  cp LICENSE README.md "$out/share/doc/doom_share/"
  # Belt and braces: refuse to package anything but the v1.9 shareware WAD.
  echo "f0cefca49926d00903cf57551d901abe  $out/share/games/doom/doom1.wad" | md5sum -c -
'''

[options]
systems = ["aarch64-linux", "x86_64-linux", "aarch64-darwin"]
