schema-version = "1.16.0"

## coreutils and gnused are build-time only. crispy-doom is a runtime
## dependency of [build.doom] alone; [build.doom_share] keeps
## runtime-packages empty so the engine stays the consumer's choice there.
[install]
coreutils.pkg-path = "coreutils"
gnused.pkg-path = "gnused"
crispy-doom.pkg-path = "crispy-doom"

[build.doom_share]
description = "DOOM shareware v1.9 by id Software (Episode 1: Knee-Deep in the Dead) plus a launcher for any Doom engine"
version = "1.9"
# Pure: built from git-tracked files only, no network. This is what makes
# `flox publish` reproducible: the WAD in the package is the WAD in git.
sandbox = "pure"
# The package is data plus a shell script; it needs no packages at runtime.
runtime-packages = []
command = '''
  set -euo pipefail
  mkdir -p "$out/bin" "$out/share/games/doom" "$out/share/doc/doom_share"
  cp wads/doom1.wad "$out/share/games/doom/doom1.wad"
  cp bin/doom_share "$out/bin/doom_share"
  chmod 0755 "$out/bin/doom_share"
  cp LICENSE README.md "$out/share/doc/doom_share/"
  # Belt and braces: refuse to package anything but the v1.9 shareware WAD.
  echo "f0cefca49926d00903cf57551d901abe  $out/share/games/doom/doom1.wad" | md5sum -c -
'''

[build.doom]
description = "DOOM shareware v1.9 by id Software (Episode 1: Knee-Deep in the Dead), ready to play with Crispy Doom"
version = "1.9"
sandbox = "pure"
# The engine travels with the package; Flox puts it on PATH for $out/bin.
runtime-packages = ["crispy-doom"]
command = '''
  set -euo pipefail
  # ${doom_share} is that build's $out: the WAD, its checksum check and the
  # docs are defined once. Only share/ is taken; bin/ there is that package's
  # own wrapped launcher. Store paths come back read-only.
  mkdir -p "$out/bin" "$out/share"
  cp -r ${doom_share}/share/. "$out/share/"
  chmod -R u+w "$out/share"
  mv "$out/share/doc/doom_share" "$out/share/doc/doom"
  cp bin/doom "$out/bin/doom"
  chmod 0755 "$out/bin/doom"
'''

[options]
systems = ["aarch64-linux", "x86_64-linux", "aarch64-darwin"]
